  version_label:
    zh: "Latest Release"
    en: "Latest Release"
  released_at: "2024-03-11"
  updated_at: "2024-06-10"
  min_os:
    zh: "macOS"
    en: "macOS"
  links:
    primary: "https://github.com/petterobam/Z2y-Product/releases/latest"
    primary_label:
      zh: "下载最新版"
      en: "Download latest"
    source: "https://github.com/petterobam/Z2y-Product"
    product: "https://z2y-zh.zero2you.tech/"
  highlights:
    - zh: "一键生成品牌、产品、博客与问题等静态门户"
      en: "Generate brand, product, blog, and knowledge sites"
    - zh: "把 GitHub 仓库当作文件系统进行浏览、收藏与分组"
      en: "Browse, collect, and group GitHub repositories as files"
    - zh: "支持 Ollama 本地模型与 Prompt 管理"
      en: "Manage Ollama models and prompts locally"
    - zh: "集成编辑器、浏览器、终端与阅读管理"
      en: "Integrated editor, browser, terminal, and reading workflows"
  requirements:
    - zh: "macOS 桌面环境"
      en: "macOS desktop environment"
    - zh: "使用 GitHub 功能时需要 GitHub 账号"
      en: "A GitHub account is required for GitHub features"
  install:
    - zh: "从 GitHub Releases 下载最新压缩包。"
      en: "Download the latest archive from GitHub Releases."
    - zh: "解压后将 Z2Y 应用移动到“应用程序”文件夹。"
      en: "Unzip the archive and move the Z2Y app to Applications."
    - zh: "首次打开时按 macOS 提示完成安全确认。"
      en: "Follow the macOS security prompt the first time you open it."
