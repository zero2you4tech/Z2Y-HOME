      related theory'
  - zh: 节奏提示与可执行的生活建议，并可展开十二时辰完整对照表
    en: A rhythm cue with one actionable suggestion, plus the full twelve-phase table
  - zh: 食补：把家中食材记成清单，按现有食材查看养生菜谱推荐
    en: 'Food notes: keep an inventory of what you have and cook from those ingredients'
