    - q:
        zh: "为什么第一次打开会被 macOS 拦截？"
        en: "Why does macOS block the first launch?"
      a:
        zh: "应用来自 GitHub 分发时可能未使用 Apple 公证。请在“系统设置 → 隐私与安全性”中确认打开，并核对下载来源。"
        en: "GitHub-distributed builds may not be notarized by Apple. Confirm the download source, then allow the app from Privacy & Security in System Settings."
