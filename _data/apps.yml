    en: The first launch opens a bilingual guide with a 中文 / EN switch in the top
      corner; tap Start Experience to continue.
  - zh: 在「养生」查看当前时辰与刻、对应经络、中医理论、节奏提示和生活建议；需要完整内容时打开十二时辰对照表。
