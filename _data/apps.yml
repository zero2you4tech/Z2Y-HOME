    en: 'Three sections for the present, the recurring, and the process: countdown,
      remember, and focus'
  - zh: 记时支持每天、工作日、周末、每周、每月、每年，以及公历与农历纪念日
    en: Repeat daily, on weekdays, weekends, weekly, monthly, or yearly, with Gregorian
