- id: z2y-fitness
  order: 11
  name:
    zh: FormSet 形集
    en: FormSet
  tagline:
    zh: 双语健身训练伴侣
    en: Bilingual gym companion
  summary:
    zh: 在健身房现场快速找到动作、看清步骤、完成每一组，并得到下一次可执行的建议。
    en: Find an exercise, learn the movement, log every set, and get one actionable
      next step.
  description:
    zh: FormSet 形集是一款本地优先的双语健身训练伴侣，内置 1,324 条动作目录，可按目标部位、器械或关键词搜索和筛选， 并查看示范、步骤、目标肌群与安全提示。训练时记录组数、次数、重量或时长，并自动倒计时休息；完成后生成
      训练收据、个人最佳与趋势。无需注册账号，训练数据默认保存在本机，离线也能继续训练。
    en: FormSet is a local-first bilingual gym companion with a built-in catalog of
      1,324 exercises. Search and filter by body part, equipment, or keyword, then
      review demos, steps, target muscles, and safety notes. During a workout it logs
      sets, reps, weight, or time with an automatic rest timer, and produces a receipt,
      personal bests, and trends afterward. No account is required; training data
      stays on your device and keeps working offline.
  logo: "/assets/apps/Z2Y-Fitness/logo.png"
  accent: "#c8ff5a"
  platforms:
  - iOS
  price:
    zh: "¥15.00"
    en: "$1.99"
  status: available
  featured: true
  version: '1.0'
  version_label:
    zh: App Store 当前版本
    en: Current App Store version
  released_at: '2026-08-29'
  updated_at: '2026-08-29'
  min_os:
    zh: iOS 17.0 或更高版本
    en: iOS 17.0 or later
  links:
    primary: https://apps.apple.com/cn/app/formset-%E5%BD%A2%E9%9B%86/id6801817700?uo=4
    primary_label:
      zh: 在 App Store 查看
      en: View on the App Store
    support: "/support/z2y-fitness/"
  highlights:
  - zh: 内置 1,324 条动作，中英双语名称与步骤
    en: 1,324 built-in exercises with bilingual names and steps
  - zh: 按目标部位、器械与关键词快速筛选动作
    en: Filter exercises by body part, equipment, and keyword
  - zh: 记录组数、次数、重量或时长，并自动倒计时休息
    en: Log sets, reps, weight, or time with an automatic rest timer
  - zh: 训练收据、个人最佳与趋势都保存在本机
    en: Receipts, personal bests, and trends stay on your device
  screenshots:
  - image: "/assets/apps/Z2Y-Fitness/screen-today.jpg"
    caption:
      zh: 今日：本周节奏、训练集预览与最近训练
      en: 'Today: weekly rhythm, plan preview, and recent sessions'
  - image: "/assets/apps/Z2Y-Fitness/screen-explore.jpg"
    caption:
      zh: 动作库：搜索并按部位、器械筛选 1,324 条动作
      en: 'Explore: search and filter 1,324 exercises by body part and equipment'
  - image: "/assets/apps/Z2Y-Fitness/screen-workout.jpg"
    caption:
      zh: 训练：逐组记录次数、重量与 RPE，并标记疼痛
      en: 'Workout: log reps, weight, and RPE per set, and flag pain'
  - image: "/assets/apps/Z2Y-Fitness/screen-ipad-explore.jpg"
    caption:
      zh: iPad 同样可用，界面自适应大屏
      en: Also available on iPad with a layout that adapts to the larger screen
  requirements:
  - zh: 运行 iOS 17.0 或更高版本的 iPhone 或 iPad
    en: iPhone or iPad running iOS 17.0 or later
  - zh: 无需注册账号；训练数据默认保存在本机
    en: No account required; training data is stored on your device
  install:
  - zh: 从 App Store 安装 FormSet 形集并打开，无需注册或登录。
    en: Install FormSet from the App Store and open it; no sign-up or login is required.
  - zh: 在“今日”页选择一种开始方式：继续训练、空白训练、按部位开始、按器械开始，或直接打开一个训练集。
    en: 'On Today, pick a starting point: continue a workout, start blank, start by
      body part, start by equipment, or open a plan.'
  - zh: 在“动作库”用关键词、目标部位或器械筛选动作，打开详情查看示范、步骤、目标肌群与安全提示，并可收藏或加入训练。
    en: In Explore, filter by keyword, body part, or equipment, then open an exercise
      for its demo, steps, target muscles, and safety notes. Favorite it or add it
      to a workout.
  - zh: 在“训练”页调整动作顺序、组数与目标，输入每组的次数、重量或时长；完成一组后自动进入休息倒计时，可暂停、跳过、撤销或加时。
    en: In Workout, adjust order, sets, and targets, then enter reps, weight, or time
      for each set. Finishing a set starts the rest timer; pause, skip, undo, or add
      time as needed.
  - zh: 完成训练后查看训练收据：完成动作、总组数、时长、个人最佳，以及一条基于已记录事实的下一次建议。
    en: 'After finishing, review the receipt: completed exercises, total sets, duration,
      personal bests, and one next step based on what you actually logged.'
  - zh: 在“记录”页按日历回看每一次训练，并查看单个动作的历史与趋势。
    en: In History, browse past sessions on the calendar and review per-exercise history
      and trends.
  - zh: 在“我的”中切换界面语言与重量单位、管理通知与可选分析，并导出 JSON / CSV 或删除本机记录。
    en: In Profile, switch language and weight unit, manage notifications and optional
      analytics, and export JSON / CSV or delete local records.
  - zh: 动作目录与训练记录支持离线使用；重新联网后无需重新登录。
    en: The catalog and workout records work offline; no re-login is needed when you
      are back online.
  faq:
  - q:
      zh: 需要注册账号吗？
      en: Do I need an account?
    a:
      zh: 不需要。首次打开即可使用全部功能，训练数据默认保存在本机。
      en: No. Every feature is available on first launch, and training data is stored
        on your device by default.
  - q:
      zh: 可以离线使用吗？
      en: Can I use it offline?
    a:
      zh: 可以。动作目录和本地训练记录支持离线访问；联网只用于 App Store 更新等系统功能。
      en: Yes. The exercise catalog and local workout records work offline; the network
        is only used for system features such as App Store updates.
  - q:
      zh: 如何导出或删除我的数据？
      en: How do I export or delete my data?
    a:
      zh: 进入“我的 → 数据权利”，可导出 JSON / CSV 或删除本机记录。删除操作不可撤销。
      en: Open Profile → Data rights to export JSON / CSV or delete local records.
        Deletion cannot be undone.
  - q:
      zh: 训练数据会同步到云端或 Apple 健康吗？
      en: Does my data sync to the cloud or Apple Health?
    a:
      zh: 当前版本不上传训练数据，也未接入 Apple 健康；记录保存在本机，可由你自行导出。
      en: The current version does not upload training data and does not connect to
        Apple Health; records stay on your device and you can export them yourself.
  changelog:
  - version: '1.0'
    date: '2026-08-29'
    notes:
      zh: 上架 App Store：双语动作库、训练记录、训练收据与本机数据管理。
      en: 'Released on the App Store: bilingual exercise catalog, workout logging,
        receipts, and on-device data controls.'
- id: z2y-timer
  order: 12
  name:
    zh: Z2Y 记时
    en: Z2Y Remember Timer
  tagline:
    zh: 把完成的时间留成印记
    en: Turn finished time into a mark
  summary:
    zh: 计时、记时与专注收进同一个应用：完成一段就留下一个印记，再在时间簿里看见自己真实的投入。
    en: Countdowns, recurring reminders, and focus sessions in one app — every finished
      stretch leaves a mark you can revisit in the time book.
  description:
    zh: Z2Y 记时围绕三个板块组织时间：计时给一段时长设定清晰的边界，明确开始，也明确结束；记时按天、工作日、每周、每月或每年记住周期事务，并用公历或农历记下纪念日，只在下一次发生前出现；专注把总时长拆成一圈圈，用轻提醒维持节奏。完成后会留下一枚印记：大小表示实际时长，颜色表示类别，轮廓表示状态。印记落进时间簿，日页与周页随时可以回看；月页与年度汇总属于可选的
      Pro。应用不需要注册账号，没有云端与广告，方案、记录与印记都保存在设备上，计时状态离开应用也会继续。
    en: 'Z2Y Remember Timer organises time around three sections. Countdown gives
      a stretch of time a clear boundary — a clear start and a clear end. Remember
      keeps recurring commitments (daily, weekdays, weekly, monthly, yearly) and anniversaries
      on the Gregorian or lunar calendar, showing them only before the next occurrence.
      Focus splits a total duration into rings with gentle cues that keep the rhythm.
      Every finished session leaves a mark: size is the real duration, colour is the
      category, and outline is the status. Marks fall into the time book, where day
      and week pages are always available and the month page plus yearly review belong
      to optional Pro. No account, no cloud, no ads: plans, records, and marks stay
      on your device, and a running timer continues after you leave the app.'
  logo: "/assets/apps/Z2Y-Timer/logo.png"
  accent: "#6fd3b4"
  platforms:
  - iOS
  price:
    zh: "¥1.00"
    en: "$0.99"
  status: available
  featured: true
  version: 2.0.0
  version_label:
    zh: App Store 当前版本
    en: Current App Store version
  released_at: '2025-06-24'
  updated_at: '2026-10-10'
  min_os:
    zh: iOS / iPadOS 16.4 或更高版本
    en: iOS or iPadOS 16.4 or later
  links:
    primary: https://apps.apple.com/cn/app/id6747674764
    primary_label:
      zh: 在 App Store 查看
      en: View on the App Store
    support: "/support/z2y-timer/"
  highlights:
  - zh: 计时、记时、专注三个板块，分别对应现在、周期与过程
    en: 'Three sections for the present, the recurring, and the process: countdown,
      remember, and focus'
  - zh: 记时支持每天、工作日、周末、每周、每月、每年，以及公历与农历纪念日
    en: Repeat daily, on weekdays, weekends, weekly, monthly, or yearly, with Gregorian
      and lunar anniversaries
  - zh: 完成后留下一枚印记，时间簿按日、周、月回看真实投入
    en: Every finished session leaves a mark in the day, week, and month time book
  - zh: 本地优先：没有账号、没有云端、没有广告
    en: 'Local-first: no account, no cloud, no ads'
  screenshots:
  - image: "/assets/apps/Z2Y-Timer/screenshots/iphone-01-timer.png"
    caption:
      zh: 计时：给一段时间设定清晰的边界，可以从方案开始，也可以新建自定义时长
      en: 'Countdown: set a clear boundary, start from a plan, or build a custom duration'
  - image: "/assets/apps/Z2Y-Timer/screenshots/iphone-02-timebook-day.png"
    caption:
      zh: 时间簿日页：完成印记、投入时间与完成率，按天回看节奏
      en: 'Time book day page: completed marks, time invested, and completion rate'
  - image: "/assets/apps/Z2Y-Timer/screenshots/iphone-03-timebook-week.png"
    caption:
      zh: 时间簿周页（深色）：一周的印记落在同一条节奏上
      en: 'Time book week page in dark mode: a week of marks on one rhythm'
  - image: "/assets/apps/Z2Y-Timer/screenshots/iphone-04-completion.png"
    caption:
      zh: 完成反馈：实际与计划时长对照，并把这段放进今天
      en: 'Completion moment: actual versus planned duration, placed into today'
  - image: "/assets/apps/Z2Y-Timer/screenshots/iphone-05-timebook-month.png"
    caption:
      zh: 月页日历与年度回顾属于 Pro，日页与周页继续免费
      en: The month calendar and yearly review belong to Pro; day and week stay free
  requirements:
  - zh: 运行 iOS 或 iPadOS 16.4 或更高版本的 iPhone 或 iPad
    en: iPhone or iPad running iOS or iPadOS 16.4 or later
  - zh: 无需注册账号；方案、记录与印记保存在本机
    en: No account required; plans, records, and marks stay on your device
  - zh: 完成提醒与记时提醒需要通知权限，拒绝后计时与时间簿仍然可用
    en: Completion and reminder alerts need notification permission; the timer and
      time book still work without it
  install:
  - zh: 从 App Store 安装 Z2Y 记时并打开，无需注册或登录。
    en: Install Z2Y Remember Timer from the App Store and open it; no sign-up or login
      is required.
  - zh: 底部固定三个板块：计时用于给一段时长设边界，记时用于周期事务与纪念日，专注用于把总时长拆成提醒环。
    en: 'Three sections sit in the bottom bar: countdown for a bounded stretch of
      time, remember for recurring commitments and anniversaries, and focus for splitting
      a total duration into rings.'
  - zh: 在计时板块点方案的「开始」，或用「新建自定义计时」设置时、分、秒；运行中可以暂停、继续或结束。
    en: In countdown, tap Start on a plan or create a custom countdown with hours,
      minutes, and seconds; pause, resume, or end it while it runs.
  - zh: 在计时段点「…」或铅笔图标编辑方案：改名称、图标、时长与完成提示，不需要的方案可以直接删除。
    en: In countdown, edit a plan to change its name, icon, duration, and completion
      cue, and delete the ones you no longer need.
  - zh: 在记时板块点「+」新建记时：填写名称、24 小时制时间与重复周期（每天、工作日、周末、每周、每月、每年），或建立公历 / 农历纪念日。
    en: 'In remember, tap + to add an entry: name, 24-hour time, and a repeat rule
      (daily, weekdays, weekends, weekly, monthly, yearly), or an anniversary on the
      Gregorian or lunar calendar.'
  - zh: 每条记时会显示距离下一次的倒计时，并可以用开关单独暂停或恢复提醒；长按条目的「…」可以编辑或删除。
    en: Each entry shows a countdown to its next occurrence and has its own reminder
      switch; open its menu to edit or delete it.
  - zh: 在专注板块选择或定制专注节奏（总时长加每环时长），运行中每完成一环会有一次轻提醒，结束后保留本次完成情况。
    en: In focus, pick or build a focus rhythm (total duration plus ring length).
      Each finished ring gives one gentle cue, and the session result is kept when
      you stop.
  - zh: 完成后打开时间簿：日页与周页回看节奏与累积，可以导出分享卡片；月页日历与年度汇总需要 Pro。
    en: 'After finishing, open the time book: day and week pages show your rhythm
      and totals, and share cards can be exported; the month calendar and yearly review
      need Pro.'
  - zh: 在设置中管理通知、声音与振动、外观与印记主题，并在「数据与隐私」中导出 JSON / CSV、导入旧版数据或查看隐私说明。
    en: In settings, manage notifications, sound and haptics, appearance and mark
      themes, then use Data & privacy to export JSON / CSV, import legacy data, or
      review the privacy note.
  faq:
  - q:
      zh: 需要注册账号吗？
      en: Do I need an account?
    a:
      zh: 不需要。安装后即可使用全部计时功能，方案、记录与印记都保存在本机。
      en: No. Every timing feature is available right after install, and plans, records,
        and marks are stored on your device.
  - q:
      zh: 免费版和 Pro 有什么区别？
      en: What does Pro add?
    a:
      zh: 基础计时、完成提醒以及日页 / 周页时间簿对所有用户免费；Pro 提供更多印记主题与纸张、月页日历与年度长期回顾，以及专属分享卡片。购买方案与价格以应用内购买页和
        App Store 显示为准。
      en: Core timing, completion alerts, and the day / week time book are free for
        everyone. Pro adds more mark themes and papers, the month calendar with yearly
        review, and dedicated share cards. Plans and prices follow what the in-app
        purchase screen and the App Store show.
  - q:
      zh: 拒绝通知权限会怎样？
      en: What happens if I deny notifications?
    a:
      zh: 计时与时间簿仍然可以正常使用。完成提醒和记时提醒不会在后台出现，但记时仍会保留并显示下一次发生时间，随时可以在系统设置中重新开启。
      en: The timer and time book keep working. Completion and reminder alerts will
        not appear in the background, but each entry still keeps and shows its next
        occurrence time, and you can enable notifications again in system settings.
  - q:
      zh: 数据会被上传吗？
      en: Is my data uploaded?
    a:
      zh: 不会。应用没有账号体系，也不连接云端；方案、记录、印记与偏好只保存在设备上。可在设置中导出 JSON / CSV 备份，或从旧版数据导入。
      en: No. There is no account system and no cloud service; plans, records, marks,
        and preferences stay on your device. You can export JSON / CSV backups or
        import data from the legacy version in settings.
  - q:
      zh: 删除 App 会怎样？
      en: What happens if I delete the app?
    a:
      zh: 删除 App 会同时移除保存在设备上的方案、记录与印记，且无法恢复。删除前请先在设置中导出 JSON / CSV。
      en: Deleting the app also removes the plans, records, and marks stored on the
        device, and they cannot be restored. Export JSON / CSV from settings first
        if you want a copy.
  changelog:
  - version: 2.0.0
    date: '2026-10-10'
    notes:
      zh: App Store 发布 2.0.0：优化计时、记时与专注三个板块的交互体验，支持删除计划与纪念日，并改进返回与滑动切换。
      en: '2.0.0 on the App Store: refined the countdown, remember, and focus sections,
        added deletion for plans and anniversaries, and improved back navigation and
        swipe switching.'
