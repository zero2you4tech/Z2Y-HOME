    en: "Z2Y E&M"
  tagline:
    zh: "品牌与创造"
    en: "Brand and build"
  summary:
    zh: "从品牌雏形到内容发布，把创建个人产品所需的工作放进一个桌面工作台。"
    en: "A desktop workbench for shaping a brand, publishing content, and building products from scratch."
