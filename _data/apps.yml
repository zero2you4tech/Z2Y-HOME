  name:
    zh: Z2Y 养生
    en: Z2Y Health
  tagline:
    zh: 传统文化养生指南
    en: A traditional-culture wellness guide
  summary:
    zh: 把传统时辰养生与日常饮食放进同一个应用：按时辰查看对应经络、节奏提示与生活建议，再用手边的食材找到能做的菜。
    en: 'Traditional time-based wellness and everyday cooking in one app: see the
      meridian, rhythm cue, and advice for the current time phase, then find dishes
      you can cook with what you already have.'
  description:
    zh: Z2Y 养生是一款围绕传统文化与日常生活的养生应用。养生页以子午流注为线索，显示当前时辰与刻、对应经络、中医理论、节奏提示和一条当天可执行的生活建议，并可展开十二时辰完整对照表；食补页把手边的食材记成一份清单，按现有食材推荐养生菜谱，另有按分类整理的
      233 道菜谱与阳台种菜指南。首次打开提供中英双语引导。应用内容用于传统文化与生活方式学习，不提供医疗诊断、治疗建议或用药指导。
    en: 'Z2Y Health is a wellness app built around traditional culture and everyday
      life. Its Wellness page follows the meridian-flow clock: it shows the current
      time phase and quarter, the corresponding meridian, the related theory, a rhythm
      cue, and one concrete suggestion for the day, with the full twelve-phase table
      one tap away. The Food page keeps an inventory of what you already have at home,
      suggests dishes from those ingredients, and adds a 233-dish recipe collection
      with category filters plus a balcony-gardening guide. A bilingual guide introduces
      the app on first launch. The content is for learning about traditional culture
      and lifestyle; it does not provide medical diagnosis, treatment advice, or medication
      guidance.'
