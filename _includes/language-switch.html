<div class="z2y-language-switch {% if include.compact %}z2y-language-switch--compact{% endif %}" role="group" aria-label="Language / 语言">
  <button type="button" class="z2y-language-option" data-set-lang="zh" aria-pressed="false">中</button>
  <span class="z2y-language-divider" aria-hidden="true">/</span>
  <button type="button" class="z2y-language-option" data-set-lang="en" aria-pressed="false">EN</button>
</div>
